<title>Porcelain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap">
<style>
/* 布局：单屏 app —— 顶栏 / 画布舞台 / 底部操作面板，深色影调，胭脂点缀 */
:root{
  --bg:#17130f;
  --panel:#211c16;
  --panel-2:#2a241c;
  --line:#383023;
  --fg:#f1e9dd;
  --muted:#a2957f;
  --accent:#e8a9a2;
  --accent-deep:#c97b73;
  --accent-ink:#2b1a17;
  --display:"ZCOOL XiaoWei","Songti SC",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  overflow:hidden;
  touch-action:pan-x pan-y;overscroll-behavior:none;
}
#app{height:100%;display:flex;flex-direction:column}

header{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--panel);
}
#logo{font-family:var(--display);font-size:22px;letter-spacing:2px;color:var(--accent)}
#status{font-size:11px;color:var(--muted)}
header .spacer{flex:1}
.hbtn{
  background:var(--panel-2);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:none;
}
.hbtn:active{background:var(--line)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.hbtn:disabled{opacity:.4;cursor:default}

#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#100d0a;overflow:hidden;touch-action:none}
#gl{max-width:100%;max-height:100%;display:block;transform-origin:center center;will-change:transform}
#drop{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  border:1.5px dashed var(--line);border-radius:16px;
  padding:42px 30px;margin:16px;text-align:center;max-width:320px;
}
#drop h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;color:var(--fg)}
#drop p{margin:0;font-size:12px;color:var(--muted);line-height:1.7}
#stageHint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;opacity:.85}

#panel{background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
#tabs{display:flex;gap:4px;padding:8px 16px 0}
.tab{
  background:none;border:none;color:var(--muted);font-size:14px;padding:8px 14px;cursor:pointer;
  border-bottom:2px solid transparent;font-family:var(--display);letter-spacing:1px;
}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{padding:10px 16px 14px;max-height:34vh;overflow-y:auto}

.srow{display:grid;grid-template-columns:minmax(3.2em,max-content) 1fr 2.6em;align-items:center;gap:10px;padding:5px 0}
.srow label{font-size:13px;color:var(--fg)}
.srow output{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.srow input[type=range]{
  width:100%;min-width:0;appearance:none;-webkit-appearance:none;height:26px;background:none;
}
.srow input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line)}
.srow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;margin-top:-7.5px;border-radius:50%;
  background:var(--accent);border:2px solid var(--accent-ink);box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.srow input[type=range]:disabled::-webkit-slider-thumb{background:var(--muted)}
.quick{display:flex;gap:8px;margin-bottom:6px}

#filters{display:flex;gap:10px;overflow-x:auto;padding:6px 2px}
.fchip{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:none;border:none;cursor:pointer;padding:4px;
}
.fchip .dot{
  width:52px;height:52px;border-radius:12px;border:2px solid transparent;
  background:var(--panel-2);
}
.fchip.on .dot{border-color:var(--accent)}
.fchip span{font-size:12px;color:var(--muted)}
.fchip.on span{color:var(--accent)}

#toast{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:rgba(20,16,12,.92);border:1px solid var(--line);color:var(--fg);
  padding:9px 16px;border-radius:10px;font-size:13px;max-width:85%;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;
}
#toast.show{opacity:1}

#saveOverlay{
  position:fixed;inset:0;background:rgba(10,8,6,.9);z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;
}
#saveOverlay img{max-width:92%;max-height:70%;border-radius:8px}
#saveOverlay p{color:var(--fg);font-size:13px;margin:0}

<script type="module">
import { FilesetResolver, FaceLandmarker } from './vendor/tasks_vision_bundle.mjs';

const $ = s => document.querySelector(s);
const stage = $('#stage'), glCanvas = $('#gl'), drop = $('#drop');
const statusEl = $('#status'), toastEl = $('#toast');

let landmarker = null, landmarks = null;
let foldU = { o0:[0,0], o1:[0,0], split:0.5 };
let skinRef = [0.78, 0.62, 0.54]; // 脸颊采样的肤色基准，美白按色度相似度扩散
let hairRef = [0.08, 0.07, 0.06], hairMaskCanvas = null, hairOK = false; // 发际线带
let gl, progMain, progBlur, quadBuf;
let texImg, texBlur, texMask, texHair, fboBlurA, fboBlurB, texBlurA;
let imgW = 0, imgH = 0, faceOK = false;
let compare = false, downloadsNS = undefined; // undefined = 未探测

const params = { smooth:30, whiten:20, fold:0, slim:0, cheek:0, eye:0, nose:0, bright:0, hair:0 };
// 滤镜：exposure(档), contrast, saturation, temp, tint, fade —— 调性偏清透白皙，不走欧美蜜棕
const FILTERS = [
  { name:'原片', en:'Original', g:[0,1,1,0,0,0] },
  { name:'奶油', en:'Cream',    g:[0.12,0.96,0.95,0.5,0.05,0.25] },
  { name:'冷白', en:'Cool fair',g:[0.18,1.02,0.88,-0.45,-0.05,0.10] },
  { name:'日杂', en:'Film',     g:[0.10,0.90,0.80,0.15,-0.2,0.35] },
  { name:'蜜桃', en:'Peach',    g:[0.08,1.03,1.12,0.35,0.25,0.08] },
  { name:'黑白', en:'B&W',      g:[0.05,1.08,0,0,0,0.15] },
];
let filterIdx = 0;

/* ---------- 工具 ---------- */
let toastTimer;
function toast(msg, ms=2600){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), ms);
}

/* ---------- i18n：中文环境显示克图，其余显示 Porcelain 英文界面 ---------- */
const isZH = (navigator.language||'zh').toLowerCase().startsWith('zh');
const L = (zh,en) => isZH ? zh : en;
if(isZH){
  document.title = '克图';
} else try {
  $('#logo').textContent = 'Porcelain';
  $('#status').textContent = 'Loading beauty engine…';
  const T = { btnNew:'Photo', btnReset:'Reset', btnCompare:'Compare⌛', btnSave:'Save',
    btnPick:'Choose photo', btnAuto:'Quick glow-up', btnZero:'Zero all' };
  for(const [id,t] of Object.entries(T)) document.getElementById(id).textContent = t;
  const labels = ['Smooth','Brighten','Smile lines','Slim jaw','Cheeks','Big eyes','Slim nose','Eye light','Hairline'];
  document.querySelectorAll('#pane-beauty .srow label').forEach((el,i)=>{ el.textContent = labels[i]; });
  const tabs = ['Beauty','Filters'];
  document.querySelectorAll('.tab').forEach((el,i)=>{ el.textContent = tabs[i]; });
  $('#drop h2').textContent = 'Choose a photo to retouch';
  $('#drop p').innerHTML = 'Everything runs in your browser — photos never leave your device.<br>On a phone you can shoot straight from the camera.';
  $('#stageHint').textContent = 'Hold "Compare" to see the original';
} catch(e){ console.error('[ketu] i18n apply failed', e); }

/* ---------- MediaPipe ---------- */
async function initLandmarker(){
  try{
    const fileset = await FilesetResolver.forVisionTasks('./vendor/wasm');
    const opts = d => ({
      baseOptions:{ modelAssetPath:'./vendor/face_landmarker.task.wasm', delegate:d },
      runningMode:'IMAGE', numFaces:1,
    });
    try{ landmarker = await FaceLandmarker.createFromOptions(fileset, opts('GPU')); }
    catch{ landmarker = await FaceLandmarker.createFromOptions(fileset, opts('CPU')); }
    statusEl.textContent = '';
  }catch(e){
    console.error('[ketu] landmarker init failed', e);
    statusEl.textContent = L('人脸引擎没起来，滤镜仍可用','Face engine failed — filters still work');
  }
}

/* ---------- 关键点索引（MediaPipe FaceMesh 468+iris） ---------- */
const OVAL  = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const EYE_L = [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
const EYE_R = [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382];
const BROW_L= [70,63,105,66,107,55,65,52,53,46];
const BROW_R= [300,293,334,296,336,285,295,282,283,276];
const LIPS  = [61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185];

const pt = i => landmarks[i];
const centroid = idxs => {
  let x=0,y=0; for(const i of idxs){x+=pt(i).x;y+=pt(i).y}
  return {x:x/idxs.length, y:y/idxs.length};
};
const dist2 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

/* ---------- 皮肤/眼睛 mask（2D canvas 画多边形，R=皮肤 G=眼睛） ---------- */
function polyPath(ctx, idxs, w, h, scaleAbout=null, k=1){
  ctx.beginPath();
  idxs.forEach((i,n)=>{
    let x=pt(i).x, y=pt(i).y;
    if(scaleAbout){ x = scaleAbout.x + (x-scaleAbout.x)*k; y = scaleAbout.y + (y-scaleAbout.y)*k; }
    n ? ctx.lineTo(x*w, y*h) : ctx.moveTo(x*w, y*h);
  });
  ctx.closePath();
}
function buildMaskCanvas(){
  const w = Math.round(imgW/2), h = Math.round(imgH/2);
  const faceW = dist2(pt(234), pt(454)) * imgW; // 大致脸宽(px, 原图尺度)
  const feather = Math.max(3, faceW*0.035/2);

  const mk = () => { const c=document.createElement('canvas'); c.width=w; c.height=h; return c; };
  const skin = mk(), sctx = skin.getContext('2d');
  sctx.filter = `blur(${Math.max(4, faceW*0.05/2)}px)`;
  sctx.fillStyle = '#fff';
  // 以下巴为锚放大 10%：FaceMesh 的椭圆额头线偏保守，高额头会被切出分界线
  polyPath(sctx, OVAL, w, h, pt(152), 1.10); sctx.fill();
  sctx.globalCompositeOperation = 'destination-out';
  for(const g of [EYE_L, EYE_R]){ polyPath(sctx, g, w, h, centroid(g), 1.25); sctx.fill(); }
  // 唇/眉挖除只留本体，挖大了会在嘴周/眉周留下没吃到美白的色块
  polyPath(sctx, LIPS, w, h, centroid(LIPS), 1.12); sctx.fill();
  for(const g of [BROW_L, BROW_R]){ polyPath(sctx, g, w, h, centroid(g), 1.12); sctx.fill(); }

  const eye = mk(), ectx = eye.getContext('2d');
  ectx.filter = `blur(${Math.max(2,feather*0.7)}px)`;
  ectx.fillStyle = '#fff';
  for(const g of [EYE_L, EYE_R]){ polyPath(ectx, g, w, h, centroid(g), 1.15); ectx.fill(); }

  // 法令纹带：鼻翼→嘴角的粗圆头线，稍向脸颊侧偏移
  const fold = mk(), fctx = fold.getContext('2d');
  fctx.filter = `blur(${Math.max(2,feather)}px)`;
  fctx.strokeStyle = '#fff'; fctx.lineCap = 'round';
  fctx.lineWidth = Math.max(4, faceW*0.055/2);
  const latOff = dist2(pt(234),pt(454)) * 0.015; // 归一化脸宽的 1.5%
  // 双描：大模糊铺软边 + 小模糊提芯部浓度（单次模糊会把峰值稀释到 ~0.55）
  for(const blurK of [1, 0.45]){
    fctx.filter = `blur(${Math.max(2,feather*blurK)}px)`;
    for(const [wing,corner,side] of [[98,61,-1],[327,291,1]]){
      const a = pt(wing), b = pt(corner);
      const dxn = b.x-a.x, dyn = b.y-a.y, ox = side*latOff;
      fctx.beginPath();
      fctx.moveTo((a.x - dxn*0.12 + ox)*w, (a.y - dyn*0.12)*h);
      fctx.lineTo((b.x + dxn*0.10 + ox)*w, (b.y + dyn*0.10)*h);
      fctx.stroke();
    }
  }

  const out = mk(), octx = out.getContext('2d');
  const sd = sctx.getImageData(0,0,w,h).data, ed = ectx.getImageData(0,0,w,h).data;
  const fd = fctx.getImageData(0,0,w,h).data;
  const od = octx.createImageData(w,h);
  for(let i=0;i<sd.length;i+=4){
    od.data[i]   = sd[i+3];   // R: 皮肤
    od.data[i+1] = ed[i+3];   // G: 眼睛
    od.data[i+2] = fd[i+3];   // B: 法令纹带
    od.data[i+3] = 255;
  }
  octx.putImageData(od,0,0);
  window.__ketuMask = out; // debug hook
  return out;
}

/* ---------- 发际线检测：从眉毛向上逐列扫，肤色（色度基准）结束处=发际线 ---------- */
function buildHairline(src){
  hairMaskCanvas = null; hairOK = false;
  const w = Math.round(imgW/2), h = Math.round(imgH/2);
  const half = document.createElement('canvas'); half.width=w; half.height=h;
  const hctx = half.getContext('2d');
  hctx.drawImage(src, 0, 0, w, h);
  const d = hctx.getImageData(0,0,w,h).data;

  const sr = skinRef.map(v=>v*255);
  const slum = 0.299*sr[0]+0.587*sr[1]+0.114*sr[2];
  const scr = sr[0]-slum, scg = sr[1]-slum, scb = sr[2]-slum;
  const isSkin = i => {
    const r=d[i], g=d[i+1], b=d[i+2];
    const lum = 0.299*r+0.587*g+0.114*b;
    if(lum < slum*0.45) return false;
    const cr=r-lum, cg=g-lum, cb=b-lum;
    const cd = Math.hypot(cr-scr, cg-scg, cb-scb);
    if(cd < 42) return true;
    // 高光豁免：顶光打爆的额头色度归零，别误判成头发
    return lum > slum*0.92 && Math.hypot(cr,cg,cb) < 30;
  };

  const faceWpx = dist2(pt(234),pt(454)) * imgW / 2;   // 半分辨率脸宽
  const faceHpx = (pt(152).y - pt(10).y) * h;
  const xL = Math.round(pt(234).x*w + faceWpx*0.06);
  const xR = Math.round(pt(454).x*w - faceWpx*0.06);
  const browY = Math.round(Math.min(pt(105).y, pt(334).y)*h) - 3;
  const topLimit = Math.max(0, Math.round(pt(10).y*h - faceHpx*0.35));

  const pts = []; const hairAcc=[0,0,0]; let hairN=0;
  for(let x=xL; x<=xR; x+=2){
    let run = 0, yHair = -1;
    for(let y=browY; y>=topLimit; y--){
      if(isSkin((y*w+x)*4)) run = 0;
      else { run++; if(run>=4){ yHair = y+run; break; } }  // 连续4px非肤色才算头发，跳过碎发
    }
    if(yHair > 0){
      pts.push([x, yHair]);
      for(let y=yHair-10; y<=yHair-5; y++){
        if(y<0) continue; const i=(y*w+x)*4;
        const lum = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        if(lum < slum*0.55){ hairAcc[0]+=d[i]; hairAcc[1]+=d[i+1]; hairAcc[2]+=d[i+2]; hairN++; }
      }
    }
  }
  if(pts.length < 15) return;   // 发际线找不全（光头/帽子/刘海盖额）就禁用

  // 列间中值平滑，压掉发丝毛刺
  const ys = pts.map(p=>p[1]);
  const smoothY = ys.map((_,i)=>{
    const win = ys.slice(Math.max(0,i-4), i+5).slice().sort((a,b)=>a-b);
    return win[Math.floor(win.length/2)];
  });

  if(hairN) hairRef = hairAcc.map(v=>v/hairN/255);
  void smoothY; // 扫描线只用来判有效性和采发色；成带改用邻近场，碎发自然加厚、不会画出悬空带
  const band = faceWpx * 0.055;
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  const id2 = ctx.createImageData(w,h);
  for(let y=topLimit; y<=browY; y++){
    for(let x=xL; x<=xR; x++){
      const i=(y*w+x)*4;
      const lum = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      if(lum < slum*0.5){ id2.data[i]=255; id2.data[i+3]=255; }
    }
  }
  ctx.putImageData(id2,0,0);
  const c2 = document.createElement('canvas'); c2.width=w; c2.height=h;
  const ctx2 = c2.getContext('2d');
  ctx2.filter = `blur(${Math.max(3, band*0.6)}px)`;
  ctx2.drawImage(c,0,0);
  ctx2.filter = `blur(${Math.max(2, band*0.25)}px)`;
  ctx2.globalCompositeOperation = 'lighter';
  ctx2.globalAlpha = 0.7;
  ctx2.drawImage(c,0,0);
  hairMaskCanvas = c2; hairOK = true;
}

/* ---------- 变形参数（瘦脸/大眼/瘦鼻 → shader 的 op 列表） ---------- */
function buildOps(){
  const ops = [];
  if(!faceOK) return ops;
  const asp = imgW/imgH;
  const A = p => ({x:p.x*asp, y:p.y});          // 纵横比修正空间
  const faceW = Math.hypot((pt(234).x-pt(454).x)*asp, pt(234).y-pt(454).y);
  const mouth = A(pt(13)), noseTip = A(pt(4));

  // 瘦脸：下颌两侧各两点往嘴部推
  if(params.slim>0){
    const s = params.slim/100 * 0.13;
    for(const i of [172,136,150, 397,365,379]){
      const p = A(pt(i));
      const dx = mouth.x-p.x, dy = mouth.y-p.y, d = Math.hypot(dx,dy)||1;
      ops.push({cx:p.x, cy:p.y, r:faceW*0.28, s:s*0.55, dirx:dx/d, diry:dy/d, type:0});
    }
  }
  // 收颊：中脸颊（苹果肌下缘）往鼻中轴水平收，和瘦脸（下颌）分开管
  if(params.cheek>0){
    const s = params.cheek/100 * 0.135;
    for(const i of [50,205, 280,425]){
      const p = A(pt(i));
      const dx = noseTip.x - p.x, dy = 0.03, d = Math.hypot(dx,dy)||1;
      ops.push({cx:p.x, cy:p.y, r:faceW*0.26, s:s*0.5, dirx:dx/d, diry:dy/d, type:0});
    }
  }
  // 大眼：径向放大
  if(params.eye>0){
    const s = params.eye/100 * 0.22;
    for(const [ring,o,inn] of [[EYE_L,33,133],[EYE_R,263,362]]){
      const c = centroid(ring), cc = A(c);
      const r = Math.hypot((pt(o).x-pt(inn).x)*asp, pt(o).y-pt(inn).y) * 1.15;
      ops.push({cx:cc.x, cy:cc.y, r, s, dirx:0, diry:0, type:1});
    }
  }
  // 瘦鼻：鼻翼往中轴推
  if(params.nose>0){
    const s = params.nose/100 * 0.14;
    const wl = A(pt(98)), wr = A(pt(327));
    const noseW = Math.hypot(wl.x-wr.x, wl.y-wr.y);
    for(const [p,other] of [[wl,wr],[wr,wl]]){
      const dx = (other.x-p.x), d = Math.abs(dx)||1;
      ops.push({cx:p.x, cy:p.y, r:noseW*1.05, s, dirx:dx/d, diry:0, type:0});
    }
  }
  return ops.slice(0,16);
}

/* ---------- WebGL ---------- */
const VS = `
attribute vec2 aUV; varying vec2 vUV; uniform float uFlipY;
void main(){ vUV=aUV; float py=aUV.y*2.0-1.0; if(uFlipY>0.5) py=-py;
  gl_Position=vec4(aUV.x*2.0-1.0, py, 0.0, 1.0); }`;

const FS_BLUR = `
precision highp float; varying vec2 vUV;
uniform sampler2D uTex; uniform vec2 uDir; uniform float uOff[7]; uniform float uWt[7];
void main(){
  vec3 c = texture2D(uTex,vUV).rgb*uWt[0];
  for(int i=1;i<7;i++){
    c += texture2D(uTex, vUV + uDir*uOff[i]).rgb*uWt[i];
    c += texture2D(uTex, vUV - uDir*uOff[i]).rgb*uWt[i];
  }
  gl_FragColor = vec4(c,1.0);
}`;

const FS_MAIN = `
precision highp float; varying vec2 vUV;
uniform sampler2D uImg, uBlur, uMask;
uniform vec2 uRes;
uniform int uOpCount;
uniform vec4 uOpA[16]; // cx, cy, r, s   (纵横比修正空间)
uniform vec4 uOpB[16]; // dirx, diry, type, 0
uniform float uSmooth, uWhiten, uBright, uFold, uHairline;
uniform vec3 uSkin;            // 脸颊肤色基准
uniform sampler2D uHairM;      // 发际线带
uniform vec3 uHairC;           // 发色
uniform vec2 uFoldO0, uFoldO1; // 两条沟的法向偏移（uv 空间）
uniform float uFoldSplit;      // 左右分界 x
uniform vec4 uG1; // exposure, contrast, saturation, temp
uniform vec2 uG2; // tint, fade

vec2 warp(vec2 p){
  vec2 asp = vec2(uRes.x/uRes.y, 1.0);
  vec2 q = p*asp;
  for(int i=0;i<16;i++){
    if(i>=uOpCount) break;
    vec2 c = uOpA[i].xy;
    float r = uOpA[i].z, s = uOpA[i].w;
    float d = distance(q,c);
    if(d<r){
      float t = 1.0-d/r;
      float fall = t*t*(3.0-2.0*t);
      if(uOpB[i].z<0.5){ q -= uOpB[i].xy*(s*r)*fall; }
      else { q = c + (q-c)*(1.0 - s*fall); }
    }
  }
  return q/asp;
}
void main(){
  vec2 uv = clamp(warp(vUV), 0.0, 1.0);
  vec3 col = texture2D(uImg, uv).rgb;
  vec3 blur = texture2D(uBlur, uv).rgb;
  vec4 m = texture2D(uMask, uv);
  // 磨皮：边缘保护 + 回贴一点细节
  float diff = length(col-blur);
  float keep = 1.0 - smoothstep(0.09, 0.28, diff);
  vec3 sm = mix(col, blur, uSmooth*m.r*keep);
  sm += (col-blur)*0.22*uSmooth*m.r;
  col = sm;
  // 法令纹：参考色从沟两侧的干净皮肤采（深沟会把原地局部平均拉暗，侧采不受污染），
  // 只提暗部保纹理；增益 1.35 补遮罩软边损耗
  if(uFold > 0.001){
    vec2 fo = uv.x < uFoldSplit ? uFoldO0 : uFoldO1;
    vec3 sideRef = max(texture2D(uBlur, uv+fo).rgb, texture2D(uBlur, uv-fo).rgb);
    vec3 fref = max(blur*1.03, sideRef*0.97);
    col = mix(col, max(col, fref), clamp(uFold*m.b*1.35, 0.0, 1.0));
  }
  // 美白：不只认多边形模板（高额头/耳朵/脖子会被切出分界线），
  // 改按肤色相似度扩散——色度接近脸颊基准就吃美白，头发背景自然排除
  float lum = dot(col, vec3(0.299,0.587,0.114));
  float slum = dot(uSkin, vec3(0.299,0.587,0.114));
  vec3 chroma = col - lum, schroma = uSkin - slum;
  float cd = length(chroma - schroma);
  float lumGate = smoothstep(slum*0.35, slum*0.7, lum);
  float skinness = max(m.r, (1.0 - smoothstep(0.07, 0.20, cd)) * lumGate);
  col = 1.0 - (1.0-col)*(1.0 - uWhiten*(0.24*skinness + 0.04));
  // 亮眼
  col *= 1.0 + uBright*m.g*0.35;
  // 发际线粉：贴着发际把皮肤往发色压暗，竖条噪声仿碎发蓬松感。
  // 乘 skinness 当闸门：墙(色度不符)和头发(太暗)都不吃，只刷皮肤
  if(uHairline > 0.001){
    float hm = texture2D(uHairM, uv).r;
    if(hm > 0.004){
      vec2 px = uv*uRes;
      float n = fract(sin(dot(vec2(floor(px.x/3.0), floor(px.y/22.0)), vec2(12.9898,78.233)))*43758.5453);
      float wgt = clamp(uHairline * hm * skinness * m.r * (0.3 + 0.7*n*n), 0.0, 1.0);
      col = mix(col, uHairC*0.85, wgt*0.38);
    }
  }
  // 调色
  col *= pow(2.0, uG1.x);
  col = (col-0.5)*uG1.y + 0.5;
  float l = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(l), col, uG1.z);
  col += vec3(uG1.w, uG2.x*0.5, -uG1.w)*0.08;
  col = mix(col, col*0.90+0.085, uG2.y);
  gl_FragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`;

function compile(type, src){
  const sh = gl.createShader(type); gl.shaderSource(sh,src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
function program(fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function mkTex(w,h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if(w) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  return t;
}
function initGL(){
  gl = glCanvas.getContext('webgl', {preserveDrawingBuffer:true});
  if(!gl){ toast(L('这设备不支持 WebGL，开不了工 😢','This device has no WebGL support 😢'), 6000); return false; }
  progMain = program(FS_MAIN);
  progBlur = program(FS_BLUR);
  quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 2,0, 0,2]), gl.STATIC_DRAW);
  return true;
}
function bindQuad(p){
  const loc = gl.getAttribLocation(p,'aUV');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}
const U = (p,n) => gl.getUniformLocation(p,n);

function setupTextures(srcCanvas, maskCanvas){
  for(const t of [texImg,texBlur,texBlurA,texMask,texHair]) if(t) gl.deleteTexture(t);
  for(const f of [fboBlurA,fboBlurB]) if(f) gl.deleteFramebuffer(f);

  texImg = mkTex();
  gl.bindTexture(gl.TEXTURE_2D, texImg);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcCanvas);

  texMask = mkTex();
  gl.bindTexture(gl.TEXTURE_2D, texMask);
  if(maskCanvas) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,maskCanvas);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));

  texHair = mkTex();
  gl.bindTexture(gl.TEXTURE_2D, texHair);
  if(hairMaskCanvas) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,hairMaskCanvas);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));

  // 半分辨率两趟高斯 → texBlur
  const bw = Math.round(imgW/2), bh = Math.round(imgH/2);
  texBlurA = mkTex(bw,bh); texBlur = mkTex(bw,bh);
  fboBlurA = gl.createFramebuffer(); fboBlurB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlurA);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texBlurA, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlurB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texBlur, 0);

  // sigma 跟脸宽走
  let sigma = 8;
  if(faceOK){
    const eyeDist = dist2(centroid(EYE_L), centroid(EYE_R)) * imgW;
    sigma = Math.min(30, Math.max(5, eyeDist*0.11)) / 2; // 半分辨率尺度
  }
  const offs=[0], wts=[Math.exp(0)];
  for(let i=1;i<7;i++){ offs.push(i*sigma/2.2); wts.push(Math.exp(-0.5*Math.pow(offs[i]/sigma,2))); }
  let sum = wts[0]; for(let i=1;i<7;i++) sum += 2*wts[i];
  for(let i=0;i<7;i++) wts[i]/=sum;

  gl.useProgram(progBlur); bindQuad(progBlur);
  gl.uniform1fv(U(progBlur,'uOff[0]'), offs.map((o,i)=>i?o:0));
  gl.uniform1fv(U(progBlur,'uWt[0]'), wts);
  gl.uniform1f(U(progBlur,'uFlipY'), 0);
  gl.viewport(0,0,bw,bh);
  // 横向：img → A
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlurA);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texImg);
  gl.uniform1i(U(progBlur,'uTex'),0);
  gl.uniform2f(U(progBlur,'uDir'), 1/bw, 0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  // 纵向：A → blur
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboBlurB);
  gl.bindTexture(gl.TEXTURE_2D, texBlurA);
  gl.uniform2f(U(progBlur,'uDir'), 0, 1/bh);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

let rafPending = false;
function requestRender(){
  if(rafPending) return; rafPending = true;
  requestAnimationFrame(()=>{ rafPending=false; render(); });
}
function render(){
  if(!gl || !imgW) return;
  gl.viewport(0,0,imgW,imgH);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(progMain); bindQuad(progMain);
  gl.uniform1f(U(progMain,'uFlipY'), 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texImg);  gl.uniform1i(U(progMain,'uImg'),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texBlur); gl.uniform1i(U(progMain,'uBlur'),1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texMask); gl.uniform1i(U(progMain,'uMask'),2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texHair); gl.uniform1i(U(progMain,'uHairM'),3);
  gl.uniform2f(U(progMain,'uRes'), imgW, imgH);

  const neutral = compare;
  const ops = neutral ? [] : buildOps();
  gl.uniform1i(U(progMain,'uOpCount'), ops.length);
  const A = new Float32Array(64), B = new Float32Array(64);
  ops.forEach((o,i)=>{ A.set([o.cx,o.cy,o.r,o.s],i*4); B.set([o.dirx,o.diry,o.type,0],i*4); });
  gl.uniform4fv(U(progMain,'uOpA[0]'), A);
  gl.uniform4fv(U(progMain,'uOpB[0]'), B);
  gl.uniform1f(U(progMain,'uSmooth'), neutral?0:params.smooth/100);
  gl.uniform1f(U(progMain,'uWhiten'), neutral?0:params.whiten/100);
  gl.uniform1f(U(progMain,'uBright'), neutral?0:params.bright/100);
  gl.uniform1f(U(progMain,'uFold'), neutral?0:params.fold/100);
  gl.uniform2f(U(progMain,'uFoldO0'), foldU.o0[0], foldU.o0[1]);
  gl.uniform2f(U(progMain,'uFoldO1'), foldU.o1[0], foldU.o1[1]);
  gl.uniform1f(U(progMain,'uFoldSplit'), foldU.split);
  gl.uniform3f(U(progMain,'uSkin'), skinRef[0], skinRef[1], skinRef[2]);
  gl.uniform1f(U(progMain,'uHairline'), neutral?0:params.hair/100);
  gl.uniform3f(U(progMain,'uHairC'), hairRef[0], hairRef[1], hairRef[2]);
  const g = neutral ? FILTERS[0].g : FILTERS[filterIdx].g;
  gl.uniform4f(U(progMain,'uG1'), g[0],g[1],g[2],g[3]);
  gl.uniform2f(U(progMain,'uG2'), g[4],g[5]);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---------- 载图 ---------- */
async function loadFile(file){
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch{ toast(L('这张格式读不出来，换张 JPG/PNG 试试','Could not read this format — try a JPG/PNG')); return; }
  const MAX = 2048;
  const k = Math.min(1, MAX/Math.max(bmp.width,bmp.height));
  imgW = Math.round(bmp.width*k); imgH = Math.round(bmp.height*k);
  const src = document.createElement('canvas');
  src.width=imgW; src.height=imgH;
  src.getContext('2d').drawImage(bmp,0,0,imgW,imgH);
  bmp.close();

  landmarks = null; faceOK = false;
  if(landmarker){
    try{
      const res = landmarker.detect(src);
      if(res.faceLandmarks && res.faceLandmarks.length){
        landmarks = res.faceLandmarks[0]; faceOK = true;
      }
    }catch(e){ console.error('[ketu] detect failed', e); }
  }

  if(faceOK){
    // 肤色基准：两颊 + 额心各采一小块，取平均
    const sctx2 = src.getContext('2d');
    let acc = [0,0,0], n = 0;
    for(const i of [50, 280, 9]){
      const px = Math.round(pt(i).x*imgW), py = Math.round(pt(i).y*imgH);
      const d = sctx2.getImageData(Math.max(0,px-3), Math.max(0,py-3), 6, 6).data;
      for(let j=0;j<d.length;j+=4){ acc[0]+=d[j]; acc[1]+=d[j+1]; acc[2]+=d[j+2]; n++; }
    }
    skinRef = acc.map(v => v/n/255);

    // 法令纹侧采样偏移：垂直于沟走向、约 1.2 倍半带宽（uv 空间）
    const asp = imgW/imgH;
    const mkOff = (wing,corner)=>{
      let dx = (pt(corner).x-pt(wing).x)*asp, dy = pt(corner).y-pt(wing).y;
      const L = Math.hypot(dx,dy)||1; dx/=L; dy/=L;
      const wHalf = dist2(pt(234),pt(454))*asp * 0.042;
      return [ -dy*wHalf/asp, dx*wHalf ];
    };
    foldU = { o0:mkOff(98,61), o1:mkOff(327,291), split:pt(4).x };
    buildHairline(src);
  }

  glCanvas.width = imgW; glCanvas.height = imgH;
  if(!gl && !initGL()) return;
  setupTextures(src, faceOK ? buildMaskCanvas() : null);
  view = {k:1, tx:0, ty:0}; applyView();

  drop.hidden = true; glCanvas.hidden = false;
  $('#panel').hidden = false; $('#stageHint').hidden = false;
  // 没脸：磨皮/瘦脸/大眼/瘦鼻/亮眼全禁用，只留美白+滤镜
  for(const id of ['smooth','fold','slim','cheek','eye','nose','bright']) $('#s-'+id).disabled = !faceOK;
  $('#s-hair').disabled = !faceOK || !hairOK;
  if(!faceOK) toast(L('没认出人脸——滤镜和美白还能用，变形类先歇着','No face detected — filters still work, face tools are off'));
  requestRender();
}

/* ---------- 保存 ---------- */
async function doSave(){
  if(!imgW) return;
  compare = false; render(); // 确保 buffer 是当前效果
  const blob = await new Promise(r => glCanvas.toBlob(r, 'image/jpeg', 0.92));
  if(!blob){ toast(L('导出失败了','Export failed')); return; }
  const name = 'porcelain-' + new Date().toISOString().slice(5,16).replace(/[-:T]/g,'') + '.jpg';
  if(downloadsNS === undefined){
    try{ downloadsNS = window.claude?.use ? await window.claude.use('downloads') : null; }
    catch{ downloadsNS = null; }
  }
  if(downloadsNS){
    try{ await downloadsNS.save({filename:name, data:blob}); toast(L('已保存 ✓','Saved ✓')); return; }
    catch(e){ if(e && e.code==='declined') return; /* 其余走兜底 */ }
  }
  // 真浏览器（GitHub Pages / 本地）：直接触发下载
  if(!window.claude){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast(L('已保存到下载/相册 ✓','Saved to downloads ✓'));
    return;
  }
  // 兜底：长按/右键保存
  const url = URL.createObjectURL(blob);
  const ov = document.createElement('div'); ov.id='saveOverlay';
  ov.innerHTML = `<p>${L('手机长按图片保存到相册，电脑右键另存为','Long-press (mobile) or right-click (desktop) the image to save')}</p><img alt="retouched"><button class="hbtn">${L('关闭','Close')}</button>`;
  ov.querySelector('img').src = url;
  ov.querySelector('button').onclick = ()=>{ URL.revokeObjectURL(url); ov.remove(); };
  document.body.appendChild(ov);
}

/* ---------- 画布缩放/平移（只动图，不动工具条） ---------- */
let view = {k:1, tx:0, ty:0};
function stageCenter(){ const r = stage.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
function applyView(){
  view.k = Math.min(8, Math.max(1, view.k));
  if(view.k===1){ view.tx=0; view.ty=0; }
  const bx = glCanvas.clientWidth*view.k/2, by = glCanvas.clientHeight*view.k/2;
  view.tx = Math.max(-bx, Math.min(bx, view.tx));
  view.ty = Math.max(-by, Math.min(by, view.ty));
  glCanvas.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.k})`;
}
// 锚点缩放：让手指/鼠标下的那块图保持在原处
function zoomAt(k2, cx, cy){
  k2 = Math.min(8, Math.max(1, k2));
  const sc = stageCenter(), px = cx-sc.x, py = cy-sc.y, s = k2/view.k;
  view.tx = px - (px-view.tx)*s;
  view.ty = py - (py-view.ty)*s;
  view.k = k2; applyView();
}
const ptrs = new Map();
let gest = null;
stage.addEventListener('pointerdown', e=>{
  if(!imgW || e.target.closest('button')) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size===1) gest = {t:'pan', x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty};
  else if(ptrs.size===2){
    const [p1,p2] = [...ptrs.values()];
    gest = {t:'pinch', d0:Math.hypot(p1.x-p2.x,p1.y-p2.y)||1,
      c0:{x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2}, k0:view.k, tx0:view.tx, ty0:view.ty};
  }
});
stage.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(gest && gest.t==='pan' && ptrs.size===1 && view.k>1){
    view.tx = gest.tx + (e.clientX-gest.x);
    view.ty = gest.ty + (e.clientY-gest.y);
    applyView();
  } else if(gest && gest.t==='pinch' && ptrs.size===2){
    const [p1,p2] = [...ptrs.values()];
    const d = Math.hypot(p1.x-p2.x, p1.y-p2.y)||1;
    const c = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
    const k2 = Math.min(8, Math.max(1, gest.k0 * d/gest.d0));
    const sc = stageCenter();
    // 初始捏合中心下的图像点，缩放后仍停在当前中心下
    const ux = (gest.c0.x - sc.x - gest.tx0), uy = (gest.c0.y - sc.y - gest.ty0);
    view.tx = (c.x - sc.x) - ux*(k2/gest.k0);
    view.ty = (c.y - sc.y) - uy*(k2/gest.k0);
    view.k = k2; applyView();
  }
});
for(const ev of ['pointerup','pointercancel','pointerleave']) stage.addEventListener(ev, e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(ptrs.size===1){ const [p] = [...ptrs.values()]; gest = {t:'pan', x:p.x, y:p.y, tx:view.tx, ty:view.ty}; }
  else if(ptrs.size===0) gest = null;
});
stage.addEventListener('wheel', e=>{
  if(!imgW) return; e.preventDefault();
  zoomAt(view.k * Math.exp(-e.deltaY*0.0022), e.clientX, e.clientY);
}, {passive:false});
stage.addEventListener('dblclick', e=>{
  if(!imgW) return;
  if(view.k>1){ view.k=1; applyView(); }
  else zoomAt(2.5, e.clientX, e.clientY);
});

  b.innerHTML = `<div class="dot"></div><span>${isZH ? f.name : f.en}</span>`;

    'linear-gradient(135deg,#e8c9a8,#c9a183)','linear-gradient(135deg,#dfe3ea,#aab4c4)',
    'linear-gradient(135deg,#cfd8c2,#98a28c)','linear-gradient(135deg,#f0b8ab,#d98f88)',
    'linear-gradient(135deg,#cfcfcf,#5a5a5a)'][i];
  b.querySelector('.dot').style.background = hue;
  b.onclick = ()=> setFilter(i);
  filtersBox.appendChild(b);
});
function setFilter(i){
  filterIdx = i;
  filtersBox.querySelectorAll('.fchip').forEach((x,n)=>x.classList.toggle('on', n===i));
  requestRender();
}
